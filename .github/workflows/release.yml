name: Build wheels & publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            rust-target: aarch64-apple-darwin
            py-platform: macosx_11_0_arm64

          - name: macos-x86_64
            os: macos-13
            rust-target: x86_64-apple-darwin
            py-platform: macosx_10_9_x86_64

          - name: linux-x86_64
            os: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
            py-platform: manylinux_2_17_x86_64

          - name: linux-arm64
            os: ubuntu-latest
            rust-target: aarch64-unknown-linux-gnu
            py-platform: manylinux_2_17_aarch64

          - name: windows-x86_64
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            py-platform: win_amd64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── Linux aarch64 cross-compilation deps ─────────────────────────
      - name: Install cross-compilation tools (Linux arm64)
        if: matrix.name == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      # ── Build kalix binary ───────────────────────────────────────────
      - name: Clone kalix
        uses: actions/checkout@v4
        with:
          repository: robinmarin/kalix
          path: kalix-src

      - name: Build kalix (release)
        working-directory: kalix-src
        run: cargo build --release --target ${{ matrix.rust-target }}

      # ── Copy binary into pykalix package ─────────────────────────────
      - name: Copy binary
        shell: bash
        run: |
          BIN="kalix-src/target/${{ matrix.rust-target }}/release/kalix"
          if [[ "${{ matrix.os }}" == windows-latest ]]; then
            BIN="${BIN}.exe"
          fi
          mkdir -p src/pykalix/bin
          cp "$BIN" src/pykalix/bin/kalix${{ matrix.name == 'windows-x86_64' && '.exe' || '' }}
          chmod +x src/pykalix/bin/kalix || true

      # ── Build Python wheel ───────────────────────────────────────────
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: List wheels
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
