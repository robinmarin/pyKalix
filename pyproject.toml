[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pykalix"
version = "0.2.1"
description = "Python wrapper for kalix — declarative Kalman filtering from symbolic dynamics expressions."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Robin Marin" }]
keywords = [
  "kalman",
  "filter",
  "estimation",
  "signal-processing",
  "scientific-computing",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.10"
dependencies = ["tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2"]

[project.urls]
Homepage = "https://github.com/robinmarin/pykalix"
Repository = "https://github.com/robinmarin/pykalix"
Documentation = "https://github.com/robinmarin/pykalix#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30

[tool.setuptools.package-data]
pykalix = ["py.typed"]

[tool.ruff]
src = ["src", "tests", "examples"]
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "I",   # isort
  "N",   # pep8-naming
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "T20", # flake8-print
  "RUF", # ruff-specific
]
ignore = [
  "S101",    # assert (used in pytest tests)
  "S603",    # subprocess call (kalix is a CLI wrapper)
  "S110",    # except-pass (cleanup in shutdown)
  "BLE001",  # blind except (cleanup in shutdown)
  "SLF001",  # private member access (internal cross-module)
  "PLR2004", # magic value (tests use concrete numbers)
  "D",       # pydocstyle (docstring formatting)
  "TRY003",  # long exception messages
  "EM101",   # string literals in exceptions
  "EM102",   # f-strings in exceptions
  "RUF002",  # ambiguous × (n×n is standard matrix notation)
]

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["T201"]                    # print() is fine in examples
"tests/*.py" = ["S101", "PLR2004", "PLR0124"]

[tool.ruff.lint.isort]
known-first-party = ["pykalix"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src", "tests", "examples"]
exclude = ["dist", "build", ".pytest_cache", ".venv"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
pythonPlatform = "All"
typeCheckingMode = "standard"
